name: Repository quality baseline
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: JSON contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4 pinned to commit
      - name: Report Python runtime
        run: python3 --version
      - name: Test the repository validator
        run: python3 .github/scripts/repository_quality_baseline.py --self-test
      - name: Validate contract and configuration JSON
        run: python3 .github/scripts/repository_quality_baseline.py --check
